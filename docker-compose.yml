services:
  backend:
    build: ./backend
    container_name: pkimonitor-backend
    env_file: .env
    environment:
      # Persist SQLite inside the named volume.
      DATABASE_URL: sqlite:///./data/pkimonitor.db
    volumes:
      - pkimonitor-data:/app/data
    ports:
      - "8000:8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/api/health').status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3

  frontend:
    build: ./frontend
    container_name: pkimonitor-frontend
    depends_on:
      - backend
    environment:
      # Runtime API base for the SPA (no rebuild needed). Leave empty for
      # same-origin /api — correct behind a reverse proxy on one domain.
      # Set only if the API is a different origin, e.g. https://api.example.com.
      PUBLIC_API_BASE: ${PUBLIC_API_BASE:-}
      # Optional X-API-Key the SPA sends (only if the backend sets API_KEY).
      PUBLIC_API_KEY: ${PUBLIC_API_KEY:-}
    ports:
      # Host port is configurable via FRONTEND_PORT (default 8080); container stays 80.
      - "${FRONTEND_PORT:-8080}:80"
    restart: unless-stopped

volumes:
  pkimonitor-data:
